name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install lint tools
        run: pip install ruff==0.17.4

      - name: Ruff lint
        run: ruff check src tests scripts demo.py

      - name: Ruff format check
        run: ruff format --check src tests scripts demo.py

      - name: AST syntax check
        run: |
          python -c "
          import ast
          from pathlib import Path
          roots = [Path('src'), Path('tests'), Path('scripts'), Path('demo.py')]
          files = []
          for root in roots:
              files.extend(root.rglob('*.py') if root.is_dir() else [root])
          errors = []
          for f in sorted(files):
              if f.stat().st_size < 5:
                  continue
              try:
                  ast.parse(f.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(e)
              exit(1)
          print('All files pass syntax check')
          "

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libegl1 libgl1 libxkbcommon-x11-0

      - name: Install Python deps
        run: pip install -r requirements-lock.txt basedpyright==1.40.2

      - name: basedpyright type check
        run: basedpyright --level error src/

      - name: Import verification
        run: |
          python -c "
          from src.config import load_config
          from src.dialogue.context import ConversationContext
          from src.dialogue.persona import Persona
          from src.tts.engine import TTSEngine
          from src.audio.capture import MicrophoneCapture
          config = load_config()
          print('Core imports: OK')
          mic = MicrophoneCapture(config)
          print(f'Audio devices: {len(mic.get_audio_devices())}')
          mic.cleanup()
          print('Import verification: PASS')
          "

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libegl1 libgl1 libxkbcommon-x11-0

      - name: Install Python deps
        run: pip install -r requirements-lock.txt pytest==9.1.1 pytest-cov==7.1.0

      # No network, no microphone, no camera, no model weights: tests/conftest.py
      # forces the offline encoder stubs, blocks the torchvision weight download
      # and runs Qt headless.
      - name: Run tests
        run: pytest -q --cov=src --cov-report=term-missing

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python deps
        run: pip install -r requirements-lock.txt pytest==9.1.1

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
