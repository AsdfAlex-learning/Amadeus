[project]
name = "amadeus"
version = "0.1.0"
description = "Amadeus - LPM-inspired real-time interactive AI companion with Live2D avatar"
requires-python = "==3.11.5"
license = { text = "MIT" }
authors = [
    { name = "Amadeus Team" },
]
dependencies = [
    "PySide6>=6.6.0",
    "live2d-py>=0.5.0",
    "numpy>=1.24.0",
    "PyAudio>=0.2.13",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "whisper-cpp-python>=0.1.0",
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "pyyaml>=6.0",
    "soundfile>=0.12.0",
    "loguru>=0.7.0",
    # imported by the code but previously undeclared
    "librosa>=0.10.0",     # audio resampling fallback
    "matplotlib>=3.7.0",   # training visualisation
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "basedpyright>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The runtime contract tests are deliberately RED until the P0 fixes land;
# see docs/PROJECT_REVIEW_REPORT.md.
addopts = "-ra"

# .github/workflows/ci.yml runs `basedpyright src/`, but the project had no
# configuration for it at all. Unconfigured, basedpyright's default
# ("recommended") mode reports 203 errors and 2384 warnings against this
# largely-untyped codebase - almost all of them the reportUnknown* family, which
# describe missing annotations rather than defects. The step was therefore either
# failing permanently or being ignored.
#
# With this configuration the baseline is ~38 errors / ~55 warnings, dominated by
# reportOptionalMemberAccess on untyped attributes (guards the checker cannot
# narrow) and by third-party stub inaccuracies. That is a known backlog, so CI
# runs the step with continue-on-error until it reaches zero.
[tool.basedpyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Annotation-coverage checks: disabled because they flag untyped code as such.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownType = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportAny = false
reportExplicitAny = false
reportImplicitAny = false
reportUnusedCallResult = false
reportUnreachable = false
# Optional backends (cosyvoice2, ChatTTS, fish-speech, pyttsx3, librosa) are
# imported lazily behind try/except and are not all installed. Those are
# warnings, not errors: their absence is a supported configuration.
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
# torch's bundled stubs omit several re-exports that work at runtime
# (GradScaler, autocast). That is a stub inaccuracy, not a code defect.
reportPrivateImportUsage = "warning"
